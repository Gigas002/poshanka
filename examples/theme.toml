# Base visual theme for notification cards.
# Override fragments may patch individual tables (colors, text, …).
#
# Colors: #RRGGBB or #RRGGBBAA

[font]
name = "Noto Sans"
size = 14.0

[colors]
background = "#285577ff"
foreground = "#ffffffff"
border = "#4c7899ff"
progress = "#5588aaff"

[layout]
width = 300
# max height
height = 100
padding = 5
margin = 10

[border]
size = 2
radius = 0

[text]
# left, center, right
alignment = "left"
# Pango markup templates; see https://docs.gtk.org/Pango/pango_markup.html
summary = "<b>{summary}</b>"
body = "{body}"
# app = ""
# id = ""

[icons]
size = 64
# left, right, top, bottom
position = "left"
# XDG_ICON_THEME name or absolute root path
theme = ""
# icon-theme name shown when a notification sends no icon (or nothing else
# resolves), tried before the plain placeholder square; empty disables it
default = "dialog-information"

[progress]
# over, source
mode = "over"
# bar thickness in pixels; 0 disables the bar even when a notification
# carries a `value` hint
height = 4
