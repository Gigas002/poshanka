[package]
name = "libposhanka"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Wayland popup subscriber runtime — render, surfaces, provider feed I/O."

[features]
default = []
icons = ["dep:resvg", "dep:base64-ng", "vello_cpu/png"]

[dependencies]
base64-ng = { version = "2", optional = true }
parley = "0.12"
resvg = { version = "0.49", optional = true }
rustix = { version = "1", features = ["event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "u8_pipeline"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
